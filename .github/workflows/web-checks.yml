name: Web checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test HTTP contracts
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/web -v
      - name: Check Python syntax
        run: python -m compileall -q src/spektrafilm_web
      - name: Check JavaScript syntax
        run: node --check src/spektrafilm_web/static/app.js
